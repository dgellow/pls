name: CI
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.x
          cache: true

      - name: Check formatting
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Check lockfile is up to date
        run: |
          deno install
          git diff --exit-code deno.lock || (echo "::error::deno.lock is out of date. Run 'deno install' and commit the changes." && exit 1)

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.x
          cache: true

      - name: Type check
        run: deno check src/

      - name: Run tests
        run: deno test -A

  test-npm-build:
    name: Test npm Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.x
          cache: true

      # Node and npm as in publish.yml, so a version that cannot publish is
      # found here and not on release day.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Update npm
        run: npm install -g npm@12 && npm --version

      # All five targets, cross-compiled on Linux exactly as publish.yml does.
      - name: Build npm packages
        run: deno run -A scripts/build_npm.ts

      - name: Test CLI binary
        run: |
          ./npm/pls-linux-x64/bin/pls --version
          ./npm/pls-linux-x64/bin/pls --help

      - name: Test npm install
        run: |
          cd /tmp
          npm init -y
          npm install ${{ github.workspace }}/npm/pls ${{ github.workspace }}/npm/pls-linux-x64
          npx pls --version

      # What `npm publish` would put into each tarball.
      - name: Pack the npm packages
        run: |
          for dir in npm/*/; do
            (cd "$dir" && npm pack --dry-run)
          done

      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: npm/
          retention-days: 1

  # A cross-compiled binary can build and still not start on its own platform
  # (denoland/deno#31556), so each one is run where it is meant to run.
  test-binaries:
    name: Run binary (${{ matrix.package }})
    needs: test-npm-build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            package: pls-linux-arm64
            binary: pls
          - runner: macos-15-intel
            package: pls-darwin-x64
            binary: pls
          - runner: macos-latest
            package: pls-darwin-arm64
            binary: pls
          - runner: windows-latest
            package: pls-win32-x64
            binary: pls.exe
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: npm

      - name: Run the binary
        shell: bash
        run: |
          chmod +x "npm/${{ matrix.package }}/bin/${{ matrix.binary }}"
          "npm/${{ matrix.package }}/bin/${{ matrix.binary }}" --version
          "npm/${{ matrix.package }}/bin/${{ matrix.binary }}" --help
