name: Publish

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish-jsr:
    name: Publish to JSR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.x
          cache: true

      - name: Publish to JSR
        run: deno publish

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.x
          cache: true

      - name: Setup Node.js
        # v6, not v7: v7 no longer exports a placeholder NODE_AUTH_TOKEN, and
        # the npm update step below runs with registry-url set and no token.
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Provenance needs a recent npm. The major version is pinned: a new
      # major can drop the Node version this job runs on, and then this step
      # fails (npm 12 refuses Node 20). ci.yml runs the same step on every PR.
      - name: Update npm
        run: npm install -g npm@12 && npm --version

      - name: Build npm packages
        run: deno run -A scripts/build_npm.ts

      - name: Publish @dgellow/pls-linux-x64
        run: npm publish --access public --provenance
        working-directory: ./npm/pls-linux-x64
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @dgellow/pls-linux-arm64
        run: npm publish --access public --provenance
        working-directory: ./npm/pls-linux-arm64
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @dgellow/pls-darwin-x64
        run: npm publish --access public --provenance
        working-directory: ./npm/pls-darwin-x64
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @dgellow/pls-darwin-arm64
        run: npm publish --access public --provenance
        working-directory: ./npm/pls-darwin-arm64
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @dgellow/pls-win32-x64
        run: npm publish --access public --provenance
        working-directory: ./npm/pls-win32-x64
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @dgellow/pls
        run: npm publish --access public --provenance
        working-directory: ./npm/pls
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
